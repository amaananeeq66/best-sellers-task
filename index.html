<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best Sellers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        #track::-webkit-scrollbar        { height: 3px; display: none; }
    #track:hover::-webkit-scrollbar  { height: 6px; display: none; }
  </style>
</head>

<body class="bg-white">

    <section class="max-w-screen-xl mx-auto px-4 sm:px-6 py-8">


        <div class="flex items-center justify-between mb-5">
            <h2 class="text-xl sm:text-2xl font-bold text-gray-900 tracking-tight">Best Sellers</h2>
            <a href="#"
                class="flex items-center gap-1 text-xs font-medium text-gray-800 hover:underline whitespace-nowrap">
                Shop All Best Sellers
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </a>
        </div>
        <div id="track" class="hidden md:flex gap-3 overflow-x-auto scroll-smooth pb-3"
            style="scroll-snap-type:x mandatory;">



            <div class="group flex-none cursor-pointer"
                style="width:calc(22.2% - 10px);min-width:160px;scroll-snap-align:start;">
                <div class="relative rounded-xl overflow-hidden bg-orange-100 mb-2" style="aspect-ratio:1/1;">
                    <span
                        class="absolute top-2 left-2 z-10 text-[8px] font-bold uppercase tracking-wide bg-white text-gray-900 px-2 py-0.5 rounded-full">Best
                        Seller</span>
                    <span
                        class="absolute top-2 right-2 z-10 text-[8px] font-bold uppercase tracking-wide bg-lime-300 text-gray-900 px-2 py-0.5 rounded-full">Save
                        10%</span>
                    <img class="absolute inset-0 w-full h-full object-cover transition-opacity duration-300 group-hover:opacity-0"
                        src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500&q=80" alt="Backpack" />
                    <img class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-300 group-hover:opacity-100"
                        src="https://images.unsplash.com/photo-1622560480654-d96214fdc887?w=500&q=80"
                        alt="Backpack alt" />
                </div>
                <p class="text-[9px] font-semibold uppercase tracking-wider text-gray-900 truncate">Summit Pack
                    Terracotta 24L</p>
                <div class="flex items-center gap-1 my-1">
                    <div class="flex gap-px">
                        <svg class="w-2.5 h-2.5 fill-gray-900" viewBox="0 0 20 20">
                            <path d="M10 1l2.4 4.9 5.3.8-3.9 3.8.9 5.3L10 13.3l-4.8 2.5.9-5.3L2.3 6.7z" />
                        </svg>
                        <svg class="w-2.5 h-2.5 fill-gray-900" viewBox="0 0 20 20">
                            <path d="M10 1l2.4 4.9 5.3.8-3.9 3.8.9 5.3L10 13.3l-4.8 2.5.9-5.3L2.3 6.7z" />
                        </svg>
                        <svg class="w-2.5 h-2.5 fill-gray-900" viewBox="0 0 20 20">
                            <path d="M10 1l2.4 4.9 5.3.8-3.9 3.8.9 5.3L10 13.3l-4.8 2.5.9-5.3L2.3 6.7z" />
                        </svg>
                        <svg class="w-2.5 h-2.5 fill-gray-900" viewBox="0 0 20 20">
                            <path d="M10 1l2.4 4.9 5.3.8-3.9 3.8.9 5.3L10 13.3l-4.8 2.5.9-5.3L2.3 6.7z" />
                        </svg>
                        <svg class="w-2.5 h-2.5 fill-gray-200" viewBox="0 0 20 20">
                            <path d="M10 1l2.4 4.9 5.3.8-3.9 3.8.9 5.3L10 13.3l-4.8 2.5.9-5.3L2.3 6.7z" />
                        </svg>
                    </div>
                    <span class="text-[9px] text-gray-400">643 Reviews</span>
                </div>
                <p class="text-sm font-semibold text-gray-900">$149.95</p>
            </div>

        </div>



    </section>


    <script src="script.js">

    </script>


</body>

</html>
