<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best Sellers - V2 Desktop Dynamic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #track::-webkit-scrollbar {
            height: 3px;
            display: none;
        }

        #track:hover::-webkit-scrollbar {
            height: 6px;
            display: none;
        }
    </style>
</head>

<body class="bg-white">
    <div class="w-full mx-auto px-4 sm:px-6 py-8">
        <div class="flex items-center justify-between mb-5">
            <h2 class="text-xl sm:text-2xl font-bold text-gray-900 tracking-tight">Best Sellers</h2>
            <a href="#"
                class="flex items-center gap-1 text-xs font-medium text-gray-800 hover:underline whitespace-nowrap">
                Shop All Best Sellers
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </a>
        </div>

        <div id="track" class="hidden md:flex gap-3 overflow-x-auto scroll-smooth pb-3"
            style="scroll-snap-type:x mandatory;"></div>
        <div class="hidden md:block mt-2 h-px bg-gray-200 rounded-full">
            <div id="progressBar" class="h-full bg-gray-900 rounded-full transition-all duration-150" style="width:20%">
            </div>
        </div>
    </div>

    <script>
        const products = [
            { name: "Outside Vibes T-Shirt Sunshine", price: "$104.95", reviews: "1,234", rating: 4, badge: "Best Seller", bg: "bg-yellow-400", imgPrimary: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80", imgHover: "https://images.unsplash.com/photo-1484704849700-f032a568e944?w=500&q=80" },
            { name: "Hike Bottle Outside Vibes Forest Green", price: "$104.95", reviews: "1,234", rating: 4, badge: "Best Seller", bg: "bg-gray-100", imgPrimary: "https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=500&q=80", imgHover: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500&q=80" },
            { name: "Hike Bottle Outside Vibes Forest Green", price: "$104.95", reviews: "1,234", rating: 4, badge: "Best Seller", bg: "bg-gray-100", imgPrimary: "https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=500&q=80", imgHover: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500&q=80" },

        ];

        function buildStars(rating) {
            const path = `<path d="M10 1l2.4 4.9 5.3.8-3.9 3.8.9 5.3L10 13.3l-4.8 2.5.9-5.3L2.3 6.7z"/>`;
            let html = '';
            for (let i = 1; i <= 5; i++) { html += `<svg class="w-2.5 h-2.5 ${i <= rating ? 'fill-gray-900' : 'fill-gray-200'}" viewBox="0 0 20 20">${path}</svg>`; }
            return html;
        }

        function buildDesktopCard(p) {
            return `
    <div class="group flex-none cursor-pointer" style="width:calc(22.2% - 10px); min-width:160px; scroll-snap-align:start;">
        <div class="relative rounded-xl overflow-hidden ${p.bg} mb-2" style="aspect-ratio:1/1;">
            <span class="absolute top-2 left-2 z-10 text-[8px] font-bold uppercase tracking-wide bg-white text-gray-900 px-2 py-0.5 rounded-full">${p.badge}</span>
            <img class="absolute inset-0 w-full h-full object-cover transition-opacity duration-300 group-hover:opacity-0" src="${p.imgPrimary}" alt="${p.name}"/>
            <img class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-300 group-hover:opacity-100" src="${p.imgHover}" alt="${p.name} hover"/>
        </div>
        <p class="text-[9px] font-semibold uppercase tracking-wider text-gray-900 truncate">${p.name}</p>
        <div class="flex items-center gap-1 my-1">
            <div class="flex gap-px">${buildStars(p.rating)}</div>
            <span class="text-[9px] text-gray-400">${p.reviews} Reviews</span>
        </div>
        <p class="text-sm font-semibold text-gray-900">${p.price}</p>
    </div>`;
        }

        const track = document.getElementById('track');
        products.forEach(p => track.insertAdjacentHTML('beforeend', buildDesktopCard(p)));

        const bar = document.getElementById('progressBar');
        track.addEventListener('scroll', () => {
            const max = track.scrollWidth - track.clientWidth;
            const pct = max > 0 ? (track.scrollLeft / max) * 80 + 20 : 20;
            bar.style.width = pct + '%';
        }, { passive: true });
    </script>
</body>

</html>
