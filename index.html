<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best Sellers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style type="text/tailwindcss">
        #track::-webkit-scrollbar{height:3px;display:none;}
                    #track:hover::-webkit-scrollbar{height:6px;display:none;}
                    </style>

</head>

<body class="bg-white">

    <div class="w-full mx-auto px-6 sm:px-6 md:pr-0 md:pl-[128px] py-[36px] md:py-[50px]">

        <div class="flex items-center md:justify-between justify-center md:mb-5 mb-6 md:pr-[128px]">

            <h2 class="text-[28px] sm:text-[50px] font-bold text-gray-900 tracking-tight ">
                Best Sellers
            </h2>

            <a href="#"
                class=" items-center gap-2 text-xs font-medium text-gray-800 hover:underline whitespace-nowrap text-x hidden md:flex">

                Shop All Best Sellers

                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="12" viewBox="0 0 16 12" fill="none">
                    <path d="M1 6H14.3333M14.3333 6L9.33333 1M14.3333 6L9.33333 11" stroke="#5C553A" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>

            </a>

        </div>


        <div id="track" class="hidden md:flex gap-[24px] overflow-x-auto scroll-smooth pb-3"
            style="scroll-snap-type:x mandatory;"></div>


        <div
            class="hidden md:block mt-12 bg-gray-200 rounded-full h-[4px] hover:h-[6px] transition-all duration-300 mr-[128px]">

            <div id="progressBar" class="h-full bg-gray-900 rounded-full transition-all duration-150" style="width:20%">
            </div>

        </div>


        <div id="mobileGrid" class="md:hidden grid grid-cols-2 gap-x-3 gap-y-3"></div>


        <button id="loadMoreBtn" class="md:hidden w-full mt-4 py-3 border border-gray-900 text-gray-900 text-sm font-semibold  text-white rounded-[100px]  transition-colors duration-200 bg-black
" onclick="toggleMobile()">

            Show More
        </button>

    </div>

    <script src="script.js">


    </script>

</body>

</html>
